
name: Publish Vectra AI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vectra-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./apps/vscode-extension/package.json').version")

          echo "Release tag: $TAG"
          echo "Extension version: $VERSION"

          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag and package version do not match"
            exit 1
          fi

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: npm run package:extension

      - name: Verify VSIX
        shell: bash
        run: |
          test -f "apps/vscode-extension/vectra-ai-${GITHUB_REF_NAME#v}.vsix"

      - name: Verify publishing credential
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing GitHub secret: VSCE_PAT"
            exit 1
          fi

      - name: Publish to Marketplace
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx vsce publish \
            --packagePath "vectra-ai-${GITHUB_REF_NAME#v}.vsix"
