name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vectra-extension/package-lock.json
            vectra-web/package-lock.json
      - run: npm ci --prefix vectra-extension
      - run: npm ci --prefix vectra-web
      - run: npm run package --prefix vectra-extension
